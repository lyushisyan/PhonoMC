[geometry]
model = "box"
sizes = [1000, 100, 100]

[simulation]
particle_count = 10000
time_step = 0.1
iterations = 50000
compute_kappa = true
grid_xyz = [10, 1, 1]

[boundary]
boundary_position = [[0, 0.5, 0.5], [1, 0.5, 0.5], [0.5, 0, 0.5], [0.5, 1, 0.5], [0.5, 0.5, 0], [0.5, 0.5, 1]]
boundary_conditions = ["T", "T", "P", "P", "R", "R"]
boundary_values = [301, 299, 1, 1]
periodic_pair = [[0.5, 0, 0.5], [0.5, 1, 0.5]]

[io]
material_folder = "material/Si/"
output_folder = "results/Inplane_x1000nm_z100nm/"
