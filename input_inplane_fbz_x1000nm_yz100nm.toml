[geometry]
model = "box"
dimensions = [10000, 1000, 1000]

[simulation]
particles = 100000
timestep = 0.1
iterations = 6000
compute_thermal_conductivity = true
subvolumes_mode = "slice"
subvolumes_count = 10
subvolumes_axis = 0

[boundary]
bound_pos_mode = "relative"
bound_pos_points = [[0, 0.5, 0.5], [1, 0.5, 0.5], [0.5, 0, 0.5], [0.5, 1, 0.5], [0.5, 0.5, 0], [0.5, 0.5, 1]]
bound_cond = ["T", "T", "P", "P", "R", "R"]
bound_values = [302, 298, 0.5, 0.5]
connect_pos_mode = "relative"
connect_pos_points = [[0.5, 0, 0.5], [0.5, 1, 0.5]]

[io]
mat_folder = "Material/Si/"
results_folder = "results/Inplane_FBZ_x1000nm_yz100nm/"
