[geometry]
model = "box"
dimensions = [1000, 1000, 1000]

[simulation]
particles = 100000
timestep = 0.1
iterations = 6000
compute_thermal_conductivity = true
subvolumes_mode = "slice"
subvolumes_count = 10
subvolumes_axis = 0

[boundary]
bound_pos_mode = "relative"
bound_pos_points = [[0, 0.5, 0.5], [1, 0.5, 0.5]]
bound_cond = ["T", "T", "P"]
bound_values = [302, 298]
connect_pos_mode = "relative"
connect_pos_points = [[0.5, 0, 0.5], [0.5, 1, 0.5], [0.5, 0.5, 0], [0.5, 0.5, 1]]

[io]
mat_folder = "Material/Si/"
results_folder = "results/Cross_100nm_300K/"
