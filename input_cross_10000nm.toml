[geometry]
model = "box"
sizes = [10000, 10000, 10000]

[simulation]
particle_count = 100000
time_step = 1
iterations = 50000
compute_kappa = true
grid_xyz = [10, 1, 1]

[boundary]
boundary_position = [[0, 0.5, 0.5], [1, 0.5, 0.5]]
boundary_conditions = ["T", "T", "P"]
boundary_values = [301, 299]
periodic_pair = [[0.5, 0, 0.5], [0.5, 1, 0.5], [0.5, 0.5, 0], [0.5, 0.5, 1]]

[io]
material_folder = "material/Si/"
output_folder = "results/Cross_10000nm_300K/"
